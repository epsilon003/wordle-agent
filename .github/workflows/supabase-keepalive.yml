name: Ping Supabase
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_SERVICE_ROLE_KEY }}
        run: |
          echo "URL length: ${#URL}"
          echo "KEY length: ${#KEY}"
          echo "URL starts with: ${URL:0:8}"
      - name: Query Supabase
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_SERVICE_ROLE_KEY }}
        run: |
          curl -sf "$URL/rest/v1/runs?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
