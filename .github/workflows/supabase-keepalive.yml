name: Ping Supabase
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit API (reads Supabase)
        env:
          API: ${{ secrets.WORDLE_API_URL }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$API?t=$(date +%s)")
          echo "HTTP $code"
          [ "$code" = "200" ]
