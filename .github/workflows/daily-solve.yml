name: Daily Wordle Solve

on:
  schedule:
    # 06:10 UTC - safely after NYT's midnight-Eastern rollover year-round
    # (accounts for both EST/UTC-5 and EDT/UTC-4).
    - cron: "10 6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run solver
        env:
          WORDLE_API_URL: ${{ secrets.WORDLE_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python runner_headless.py

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            ci_debug_attempt_*.png
            ci_debug_board_not_loaded.png
          if-no-files-found: ignore